name: Publicar noticias

on:
  schedule:
    # Cada 30 minutos, en UTC, pero en los minutos 07 y 37 en vez de 00 y 30.
    # GitHub da prioridad baja a las tareas programadas y, cuando hay
    # saturación, las DESCARTA en lugar de retrasarlas. Los minutos en punto y
    # y media son los más congestionados porque es donde programa todo el
    # mundo; correr a destiempo reduce mucho los turnos perdidos.
    # Aun así no esperes relojería: seguirá habiendo saltos.
    - cron: "7,37 * * * *"
  workflow_dispatch:   # botón "Run workflow" para lanzarlo a mano

# Dos ejecuciones solapadas publicarían la misma noticia dos veces, porque cada
# una leería el historial antes de que la otra lo hubiera actualizado.
concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # necesario para guardar news.db actualizado

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # El titular de las stories se dibuja sobre la imagen y hace falta una
      # fuente TrueType; el corredor de Ubuntu no trae ninguna por defecto.
      - run: sudo apt-get install -y -qq fonts-dejavu-core

      - name: Publicar noticias
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
        run: python bot.py

      # El corredor se destruye al terminar, así que el historial de noticias
      # publicadas tiene que volver al repositorio: es la única memoria que
      # impide repetir noticias en la siguiente ejecución.
      - name: Guardar historial
        run: |
          if [ -z "$(git status --porcelain news.db)" ]; then
            echo "Sin novedades que guardar."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.db
          # Sin "[skip ci]": no hay disparador por push, así que no sirve de
          # nada, y es una variable menos a la hora de averiguar por qué
          # GitHub decide no lanzar un turno programado.
          git commit -m "historial: $(date -u '+%Y-%m-%d %H:%M') UTC"
          # Otra ejecución puede haber empujado mientras tanto; rebase y punto.
          git pull --rebase --autostash
          git push
